<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라디언트 정의 -->
    <linearGradient id="bridgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    
    <!-- 그림자 필터 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 배경 원형 -->
  <circle cx="30" cy="30" r="25" fill="url(#bridgeGradient)" filter="url(#shadow)" opacity="0.1"/>
  
  <!-- 다리 구조물 - 왼쪽 기둥 -->
  <rect x="8" y="15" width="4" height="30" fill="url(#bridgeGradient)" rx="2"/>
  
  <!-- 다리 구조물 - 오른쪽 기둥 -->
  <rect x="48" y="15" width="4" height="30" fill="url(#bridgeGradient)" rx="2"/>
  
  <!-- 다리 상판 -->
  <rect x="8" y="25" width="44" height="6" fill="url(#bridgeGradient)" rx="3"/>
  
  <!-- 케이블 -->
  <path d="M 10 15 Q 30 20 50 15" stroke="url(#accentGradient)" stroke-width="2" fill="none"/>
  <path d="M 10 18 Q 30 23 50 18" stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <!-- 한국 상징 - 태극 모티프 (왼쪽) -->
  <circle cx="18" cy="35" r="3" fill="#dc2626" opacity="0.8"/>
  <path d="M 18 32 A 3 3 0 0 1 18 38" fill="#2563eb" opacity="0.8"/>
  
  <!-- 아랍 상징 - 초승달 모티프 (오른쪽) -->
  <path d="M 42 32 A 4 4 0 1 1 42 38 A 3 3 0 1 0 42 32" fill="url(#accentGradient)"/>
  
  <!-- 연결 라인 -->
  <line x1="21" y1="35" x2="39" y2="35" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- 텍스트 부분 -->
  <text x="65" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#bridgeGradient)">
    KA
  </text>
  <text x="65" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="url(#accentGradient)">
    Bridge
  </text>
  
  <!-- 장식 요소 -->
  <circle cx="95" cy="20" r="2" fill="url(#accentGradient)" opacity="0.6"/>
  <circle cx="105" cy="25" r="1.5" fill="url(#bridgeGradient)" opacity="0.5"/>
  <circle cx="100" cy="35" r="1" fill="url(#accentGradient)" opacity="0.7"/>
</svg>